name: Update menus.json

on:
  schedule:
    # 金曜 10:00 JST = 01:00 UTC
    - cron: '0 1 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest menus
        run: node fetch-direct-menus.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- menus.json; then
            echo "menus.json に変更はありません"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add menus.json
            git commit -m "Update menus.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
